<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="KAZERA — minimalist luxury streetwear T-shirts.">
<link rel="icon" type="image/png" href="assets/images/logo.png">
<title>KAZERA</title>
<style>
:root{
  --black:#0a0a0a;--white:#fafafa;--charcoal:#232323;--line:#3a3a3a;--muted:#9a9a9a;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif;min-height:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:800;letter-spacing:-0.03em;line-height:1.02}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hide{display:none!important}

/* announcement */
#announce{background:var(--white);color:var(--black);text-align:center;font-size:12px;font-weight:700;letter-spacing:.04em;padding:8px 12px;overflow:hidden;white-space:nowrap}
#announce span{display:inline-block;padding-left:100%;animation:tick 16s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,10,10,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navrow{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;gap:16px}
.logo{font-size:24px;font-weight:900;letter-spacing:-0.04em;display:flex;align-items:center;gap:8px}
.logo img{height:34px;width:auto;display:block}
@media(max-width:480px){.logo img{height:28px}}
nav.main{display:flex;gap:26px;font-size:13px;font-weight:700;letter-spacing:.03em}
nav.main a{opacity:.85;padding-bottom:2px;border-bottom:1px solid transparent}
nav.main a:hover{opacity:1;border-color:var(--white)}
.navicons{display:flex;align-items:center;gap:16px;font-size:19px}
.navicons button{background:none;border:none;color:var(--white);position:relative}
#cartCount{position:absolute;top:-6px;right:-8px;background:var(--white);color:var(--black);font-size:10px;font-weight:800;border-radius:99px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center}
#menuBtn{display:none;background:none;border:none;color:var(--white);font-size:22px}
#searchBox{display:none;padding:10px 20px;border-bottom:1px solid var(--line)}
#searchBox input{width:100%;background:var(--charcoal);border:1px solid var(--line);color:var(--white);padding:10px 12px;font-size:14px}

/* hero */
.hero{position:relative;padding:90px 20px 70px;text-align:center;border-bottom:1px solid var(--line);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.07),transparent 60%);pointer-events:none}
.hero h1{font-size:clamp(42px,9vw,96px);text-transform:uppercase}
.hero p{color:var(--muted);max-width:480px;margin:18px auto 30px;font-size:15px}
.btn{display:inline-block;padding:14px 30px;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--white);transition:transform .25s ease,background .25s ease,color .25s ease}
.btn-solid{background:var(--white);color:var(--black)}
.btn-solid:hover{transform:translateY(-2px)}
.btn-outline{background:transparent;color:var(--white)}
.btn-outline:hover{background:var(--white);color:var(--black)}

/* sections */
.section{padding:64px 20px;border-bottom:1px solid var(--line)}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;gap:16px}
.section-head h2{font-size:clamp(26px,4vw,38px);text-transform:uppercase}
.section-head a{font-size:12px;font-weight:800;letter-spacing:.05em;border-bottom:1px solid var(--white)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{background:var(--charcoal);border:1px solid var(--line);overflow:hidden;transition:border-color .2s}
.card:hover{border-color:#666}
.card .imgbox{aspect-ratio:4/5;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden}
.card .imgbox img{width:100%;height:100%;object-fit:cover}
.card .info{padding:14px}
.card .info h3{font-size:14px;text-transform:none;letter-spacing:0;font-weight:700}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--white);color:var(--black);padding:3px 7px;margin-bottom:8px}
.price-row{display:flex;gap:8px;align-items:baseline;margin-top:6px;font-size:14px}
.mrp{color:var(--muted);text-decoration:line-through;font-size:12px}

/* offer strips */
.offer{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;background:var(--charcoal);border:1px dashed var(--line);padding:22px 26px;margin-bottom:16px}
.offer h3{font-size:18px;text-transform:uppercase}
.offer p{color:var(--muted);font-size:13px;margin-top:4px}
.code{font-family:monospace;background:var(--black);border:1px solid var(--line);padding:8px 14px;font-weight:800;letter-spacing:.05em}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.filters button{background:transparent;border:1px solid var(--line);color:var(--white);padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.filters button.active{background:var(--white);color:var(--black);border-color:var(--white)}

/* product detail */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.pd .imgbox{aspect-ratio:4/5;background:#1a1a1a}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.opt-row button{border:1px solid var(--line);background:transparent;color:var(--white);padding:8px 14px;font-size:12px;font-weight:700}
.opt-row button.active{background:var(--white);color:var(--black)}
.qty{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.qty button{width:34px;height:34px;border:1px solid var(--line);background:transparent;color:var(--white);font-size:16px}
.review{border-top:1px solid var(--line);padding:16px 0}
.stars{color:#f4c542;font-size:14px;letter-spacing:2px}
.review img,.review video{max-width:160px;margin-top:8px}

/* forms */
.form-field{margin-bottom:14px}
.form-field label{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px;color:var(--muted)}
.form-field input,.form-field textarea,.form-field select{width:100%;background:var(--charcoal);border:1px solid var(--line);color:var(--white);padding:12px;font-size:14px;font-family:inherit}
.form-field textarea{resize:vertical;min-height:80px}

/* cart */
.cart-line{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:14px 0}
.cart-line .meta{font-size:12px;color:var(--muted)}

/* popup */
#popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
#popup-box{background:var(--white);color:var(--black);max-width:380px;width:100%;padding:36px 28px;text-align:center;position:relative}
#popup-box button.close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:18px;color:var(--black)}

/* whatsapp float */
#wa-float{position:fixed;bottom:24px;right:20px;z-index:80;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.4);border:none}

footer{padding:40px 20px 30px;text-align:center;color:var(--muted);font-size:12px}
footer .flinks{display:flex;justify-content:center;gap:18px;margin-bottom:14px;font-weight:700}

/* admin */
.admin-wrap{display:flex;min-height:100vh}
.admin-side{width:210px;background:var(--charcoal);border-right:1px solid var(--line);padding:20px 0;flex-shrink:0}
.admin-side button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--white);padding:12px 20px;font-size:13px;font-weight:700}
.admin-side button.active{background:var(--white);color:var(--black)}
.admin-main{flex:1;padding:28px;overflow-x:auto}
.admin-main h2{font-size:24px;margin-bottom:20px;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:13px}
table th,table td{border-bottom:1px solid var(--line);padding:10px;text-align:left}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px}
.stat-card{background:var(--charcoal);border:1px solid var(--line);padding:18px}
.stat-card .num{font-size:26px;font-weight:800}
.stat-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.admin-card{background:var(--charcoal);border:1px solid var(--line);padding:18px;margin-bottom:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small-btn{border:1px solid var(--line);background:transparent;color:var(--white);padding:6px 12px;font-size:11px;font-weight:700}
.badge{padding:3px 8px;font-size:10px;font-weight:800;text-transform:uppercase}
.badge.Pending{background:#5a4a1a;color:#ffd66b}
.badge.Confirmed{background:#1a3a5a;color:#7ec8ff}
.badge.Shipped{background:#3a2a5a;color:#c7a3ff}
.badge.Delivered{background:#1a5a2a;color:#7dffa0}

@media(max-width:860px){
  nav.main{display:none}
  #menuBtn{display:block}
  .pd{grid-template-columns:1fr}
  .admin-wrap{flex-direction:column}
  .admin-side{width:100%;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
  .admin-side button{white-space:nowrap}
  .row2{grid-template-columns:1fr}
}
#mobileNav{display:none;flex-direction:column;background:var(--black);border-bottom:1px solid var(--line);padding:10px 20px}
#mobileNav a{padding:12px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
</style>
</head>
<body>

<div id="announce"></div>
<header>
  <div class="navrow">
    <div style="display:flex;align-items:center;gap:14px">
      <button id="menuBtn" onclick="toggleMobileNav()">☰</button>
      <a href="#/" class="logo" id="logoLink"></a>
    </div>
    <nav class="main" id="mainNav"></nav>
    <div class="navicons">
      <button onclick="toggleSearch()" title="Search">🔍</button>
      <button onclick="location.hash='#/account'" title="Account">👤</button>
      <button onclick="location.hash='#/cart'" title="Cart">🛍<span id="cartCount">0</span></button>
    </div>
  </div>
  <div id="mobileNav"></div>
  <div id="searchBox"><input id="searchInput" placeholder="Search products..." onkeyup="if(event.key==='Enter')doSearch()"></div>
</header>

<main id="app"></main>

<footer id="siteFooter"></footer>
<button id="wa-float" onclick="openWhatsApp()">🟢</button>

<script>
/* ---------------- DATA LAYER (localStorage acting as DB) ---------------- */
const DB_KEY='kzr_db_v1', CART_KEY='kzr_cart_v1';

function seed(){
  return {
    settings:{
      brand:'KAZERA', tagline:'Wear the silence.',
      logoImg:'assets/images/logo.png',
      whatsapp:'918099981296',
      waTemplate:'Hi KAZERA! I would like to place an order.\n\nOrder ID: {orderId}\n{items}\nTotal: ₹{total}\n\nName: {name}\nPhone: {phone}\nAddress: {address}',
      announcement:'FREE SHIPPING ON ORDERS ABOVE ₹1999 — NEW DROP LIVE NOW — USE CODE KAZERA10 FOR 10% OFF',
      popup:{enabled:true,title:'10% OFF YOUR FIRST ORDER',text:'Use code KAZERA10 at checkout on WhatsApp.'},
      coupons:[{code:'KAZERA10',desc:'10% off on your first order',active:true},{code:'FEST200',desc:'Flat ₹200 off above ₹1999',active:true}],
      festival:{enabled:true,title:'FESTIVAL SALE',text:'Up to 40% off — limited stock, ends soon.'},
      limited:{enabled:true,title:'LIMITED DROP',text:'Only 48 hours left on selected styles.'},
      nav:['Home','New Drop','Shop','About','FAQ','Contact'],
      about:'KAZERA is a minimalist streetwear label built for people who let silence speak louder than logos. Every piece is designed in-house and made from heavyweight cotton, cut for a considered, oversized fit.',
      faq:[{q:'What sizes do you offer?',a:'We offer S to XXL across all core styles.'},{q:'How long does delivery take?',a:'3–7 business days across India.'},{q:'How do I place an order?',a:'Add items to cart, checkout, and confirm via WhatsApp.'},{q:'What is your return policy?',a:'Unused items can be exchanged within 7 days of delivery.'}],
      contact:{phone:'+91 8099981296',email:'hello@kazera.in',address:'Guwahati, Assam, India'},
      social:{instagram:'https://instagram.com/kazera',facebook:'',twitter:''},
      maintenance:false,
      maintenanceMsg:'KAZERA is currently undergoing scheduled maintenance. We will be back shortly.',
      adminPass:'kazera123'
    },
    products:[
      {id:'p1',name:'Void Oversized Tee',price:1499,mrp:1999,category:'new',sizes:['S','M','L','XL'],colors:['Black','Charcoal'],stock:24,desc:'Heavyweight 260GSM cotton oversized tee with dropped shoulders.',img:'assets/images/products/p1.jpg'},
      {id:'p2',name:'Ash Boxy Tee',price:1299,mrp:1699,category:'bestseller',sizes:['S','M','L','XL','XXL'],colors:['White','Charcoal'],stock:40,desc:'Boxy fit essential tee in brushed cotton.',img:'assets/images/products/p2.jpg'},
      {id:'p3',name:'Monochrome Graphic Tee',price:1599,mrp:2099,category:'featured',sizes:['M','L','XL'],colors:['Black'],stock:15,desc:'Minimal front print, garment-dyed for a worn-in look.',img:'assets/images/products/p3.jpg'},
      {id:'p4',name:'Shadow Crewneck Tee',price:1399,mrp:1799,category:'new',sizes:['S','M','L'],colors:['Black','White'],stock:30,desc:'Clean crewneck silhouette with reinforced seams.',img:'assets/images/products/p4.jpg'}
    ],
    orders:[], reviews:[]
  };
}
function loadDB(){let d=localStorage.getItem(DB_KEY); if(!d){const s=seed();localStorage.setItem(DB_KEY,JSON.stringify(s));return s;} return JSON.parse(d);}
function saveDB(db){localStorage.setItem(DB_KEY,JSON.stringify(db));}
function loadCart(){return JSON.parse(localStorage.getItem(CART_KEY)||'[]');}
function saveCart(c){localStorage.setItem(CART_KEY,JSON.stringify(c));updateCartCount();}
function updateCartCount(){document.getElementById('cartCount').textContent=loadCart().reduce((a,i)=>a+i.qty,0);}

let db=loadDB();

/* ---------------- CHROME (header/nav/footer/announce/popup) ---------------- */
function renderChrome(){
  document.getElementById('logoLink').innerHTML=`<img src="${esc(db.settings.logoImg)}" alt="${esc(db.settings.brand)}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span style="display:none">${esc(db.settings.brand)}</span>`;
  document.title=db.settings.brand;
  document.getElementById('announce').innerHTML='<span>'+db.settings.announcement+' &nbsp;&nbsp;•&nbsp;&nbsp; '+db.settings.announcement+'</span>';
  const navLinks={'Home':'#/','New Drop':'#/shop?cat=new','Shop':'#/shop','About':'#/about','FAQ':'#/faq','Contact':'#/contact'};
  const navHtml=db.settings.nav.map(n=>`<a href="${navLinks[n]||'#/'}">${n}</a>`).join('');
  document.getElementById('mainNav').innerHTML=navHtml;
  document.getElementById('mobileNav').innerHTML=db.settings.nav.map(n=>`<a href="${navLinks[n]||'#/'}" onclick="toggleMobileNav()">${n}</a>`).join('');
  document.getElementById('siteFooter').innerHTML=`
    <div class="flinks">
      ${db.settings.social.instagram?`<a href="${db.settings.social.instagram}" target="_blank">Instagram</a>`:''}
      ${db.settings.social.facebook?`<a href="${db.settings.social.facebook}" target="_blank">Facebook</a>`:''}
    </div>
    <div>${db.settings.brand} — ${db.settings.contact.address}</div>
    <div>${db.settings.contact.phone} · ${db.settings.contact.email}</div>
    <div style="margin-top:10px;opacity:.6">© ${new Date().getFullYear()} ${db.settings.brand}. All rights reserved.</div>`;
  updateCartCount();
  maybeShowPopup();
}
function toggleMobileNav(){const m=document.getElementById('mobileNav');m.style.display=m.style.display==='flex'?'none':'flex';}
function toggleSearch(){const s=document.getElementById('searchBox');s.style.display=s.style.display==='block'?'none':'block';document.getElementById('searchInput').focus();}
function doSearch(){const q=document.getElementById('searchInput').value.trim();location.hash='#/shop?q='+encodeURIComponent(q);}
function maybeShowPopup(){
  if(!db.settings.popup.enabled||sessionStorage.getItem('popupShown'))return;
  sessionStorage.setItem('popupShown','1');
  setTimeout(()=>{
    const ov=document.createElement('div');ov.id='popup-overlay';
    ov.innerHTML=`<div id="popup-box"><button class="close" onclick="this.closest('#popup-overlay').remove()">✕</button>
      <h3 style="font-size:22px;text-transform:uppercase;margin-bottom:10px">${db.settings.popup.title}</h3>
      <p style="font-size:13px;color:#555">${db.settings.popup.text}</p></div>`;
    document.body.appendChild(ov);
  },1400);
}
function openWhatsApp(msg){
  const text=msg||`Hi ${db.settings.brand}! I have a question.`;
  const url=`https://wa.me/${db.settings.whatsapp}?text=${encodeURIComponent(text)}`;
  const a=document.createElement('a');
  a.href=url;a.target='_blank';a.rel='noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

/* ---------------- ROUTER ---------------- */
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parseHash(){
  const h=location.hash.slice(2)||'';
  const [path,qs]=h.split('?');
  const parts=path.split('/').filter(Boolean);
  const params={};(qs||'').split('&').forEach(p=>{if(!p)return;const [k,v]=p.split('=');params[k]=decodeURIComponent(v||'');});
  return {parts,params};
}
window.addEventListener('hashchange',route);
window.addEventListener('DOMContentLoaded',()=>{route();});

function route(){
  db=loadDB();
  if(db.settings.maintenance && !location.hash.startsWith('#/admin')){
    document.querySelector('header').classList.add('hide');
    document.getElementById('app').innerHTML=`<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px"><div><h1 style="font-size:34px;text-transform:uppercase">We'll be right back</h1><p style="color:var(--muted);margin-top:12px;max-width:420px">${esc(db.settings.maintenanceMsg)}</p></div></div>`;
    document.querySelector('footer').classList.add('hide');document.getElementById('wa-float').classList.add('hide');document.getElementById('announce').classList.add('hide');
    return;
  }
  document.querySelector('header').classList.remove('hide');document.querySelector('footer').classList.remove('hide');document.getElementById('wa-float').classList.remove('hide');document.getElementById('announce').classList.remove('hide');
  renderChrome();
  const {parts,params}=parseHash();
  const p0=parts[0]||'';
  if(p0==='admin'){renderAdmin(parts,params);return;}
  document.getElementById('app').style.display='block';
  if(p0===''||p0==='home')renderHome();
  else if(p0==='shop')renderShop(params);
  else if(p0==='product')renderProduct(parts[1]);
  else if(p0==='cart')renderCart();
  else if(p0==='checkout')renderCheckout();
  else if(p0==='account')renderAccount();
  else if(p0==='about')renderAbout();
  else if(p0==='faq')renderFAQ();
  else if(p0==='contact')renderContact();
  else document.getElementById('app').innerHTML='<div class="wrap section">Page not found.</div>';
  window.scrollTo(0,0);
}

/* ---------------- PRODUCT CARD ---------------- */
function productImgHtml(p){
  if(!p.img)return '👕';
  return `<img src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><span class="fallback-emoji" style="display:none;width:100%;height:100%;align-items:center;justify-content:center;font-size:38px">👕</span>`;
}
function productCard(p){
  return `<a class="card" href="#/product/${p.id}"><div class="imgbox">${productImgHtml(p)}</div>
    <div class="info">
      ${p.category?`<span class="tag">${p.category==='new'?'New Drop':p.category==='bestseller'?'Best Seller':'Featured'}</span><br>`:''}
      <h3>${esc(p.name)}</h3>
      <div class="price-row"><strong>₹${p.price}</strong>${p.mrp>p.price?`<span class="mrp">₹${p.mrp}</span>`:''}</div>
    </div></a>`;
}

/* ---------------- HOME ---------------- */
function renderHome(){
  const news=db.products.filter(p=>p.category==='new');
  const feat=db.products.filter(p=>p.category==='featured');
  const best=db.products.filter(p=>p.category==='bestseller');
  document.getElementById('app').innerHTML=`
    <section class="hero">
      <h1>${esc(db.settings.brand)}</h1>
      <p>${esc(db.settings.tagline)}</p>
      <a href="#/shop" class="btn btn-solid">Shop the Drop</a>
    </section>
    ${db.settings.limited.enabled||db.settings.festival.enabled?`<section class="section" style="padding-bottom:0">
      <div class="wrap">
        ${db.settings.festival.enabled?`<div class="offer"><div><h3>${esc(db.settings.festival.title)}</h3><p>${esc(db.settings.festival.text)}</p></div><a href="#/shop" class="btn btn-outline">Shop Now</a></div>`:''}
        ${db.settings.limited.enabled?`<div class="offer"><div><h3>${esc(db.settings.limited.title)}</h3><p>${esc(db.settings.limited.text)}</p></div><a href="#/shop" class="btn btn-outline">Shop Now</a></div>`:''}
      </div></section>`:''}
    ${db.settings.coupons.filter(c=>c.active).length?`<section class="section">
      <div class="wrap"><div class="section-head"><h2>Coupons</h2></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
      ${db.settings.coupons.filter(c=>c.active).map(c=>`<div class="admin-card"><div class="code">${esc(c.code)}</div><p style="font-size:13px;color:var(--muted);margin-top:8px">${esc(c.desc)}</p></div>`).join('')}
      </div></div></section>`:''}

function setOpt(k,v){pdState[k]=v;document.querySelectorAll(k==='size'?'#sizeRow button':'#colorRow button').forEach(b=>b.classList.toggle('active',b.textContent===v));}
function qtyChange(d){pdState.qty=Math.max(1,pdState.qty+d);document.getElementById('qtyVal').textContent=pdState.qty;}
function addToCart(id){
  const p=db.products.find(x=>x.id===id);const cart=loadCart();
  const key=id+pdState.size+pdState.color;
  const existing=cart.find(i=>i.key===key);
  if(existing)existing.qty+=pdState.qty;
  else cart.push({key,id,name:p.name,price:p.price,size:pdState.size,color:pdState.color,qty:pdState.qty});
  saveCart(cart);
  alert('Added to cart');
}
function buyNow(id){addToCart(id);location.hash='#/cart';}

function removeFromCart(key){saveCart(loadCart().filter(i=>i.key!==key));renderCart();}

function renderCheckout(){

  const total=cart.reduce((a,i)=>a+i.price*i.qty,0);
  document.getElementById('app').innerHTML=`<section class="section" style="border-bottom:none"><div class="wrap" style="max-width:500px">
    <h1 style="font-size:28px;text-transform:uppercase;margin-bottom:20px">Checkout</h1>

    <div style="display:flex;justify-content:space-between;padding:14px 0;font-weight:800;font-size:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:18px"><span>Total</span><span>₹${total}</span></div>
    <button class="btn btn-solid" style="width:100%" onclick="placeOrder(${total})">Confirm Order via WhatsApp</button>
    <p style="color:var(--muted);font-size:12px;margin-top:12px">Your order will open in WhatsApp for final confirmation — nothing is charged automatically.</p>
  </div></section>`;

function placeOrder(total){
  const name=document.getElementById('ckName').value.trim();
  const phone=document.getElementById('ckPhone').value.trim();
  const addr=document.getElementById('ckAddr').value.trim();
  if(!name||!phone||!addr){alert('Please fill in all fields.');return;}
  const cart=loadCart();
  const orderId='KZ'+Date.now().toString().slice(-8);
  const itemsText=cart.map(i=>`- ${i.name} | Size: ${i.size} | Colour: ${i.color} | Qty: ${i.qty} | Price: ₹${i.price*i.qty}`).join('\n');
  const msg=db.settings.waTemplate
    .replace('{orderId}',orderId).replace('{items}',itemsText).replace('{total}',total)
    .replace('{name}',name).replace('{phone}',phone).replace('{address}',addr);
  db.orders.push({id:orderId,items:cart,total,name,phone,address:addr,status:'Pending',date:new Date().toISOString()});
  saveDB(db);
  localStorage.setItem('kzr_last_phone',phone);
  saveCart([]);
  openWhatsApp(msg);
  location.hash='#/account';
}

function openReviewForm(productId){
  const p=db.products.find(x=>x.id===productId);
  document.getElementById('orderList').innerHTML+=`<div class="admin-card">
    <h3 style="margin-bottom:10px">Review: ${esc(p?p.name:'')}</h3>
    <div class="form-field"><label>Your Name</label><input id="rvName"></div>
    <div class="form-field"><label>Rating (1-5)</label><input id="rvRating" type="number" min="1" max="5" value="5"></div>
    <div class="form-field"><label>Review</label><textarea id="rvText"></textarea></div>
    <div class="form-field"><label>Product Photo</label><input id="rvPhoto" type="file" accept="image/*"></div>
    <div class="form-field"><label>Product Video</label><input id="rvVideo" type="file" accept="video/*"></div>
    <button class="btn btn-solid" onclick="submitReview('${productId}')">Submit Review</button>
  </div>`;
}
function submitReview(productId){
  const name=document.getElementById('rvName').value.trim()||'Anonymous';
  const rating=Math.min(5,Math.max(1,parseInt(document.getElementById('rvRating').value)||5));
  const text=document.getElementById('rvText').value.trim();
  const photoFile=document.getElementById('rvPhoto').files[0];
  const videoFile=document.getElementById('rvVideo').files[0];
  const finish=(photo,video)=>{
    db.reviews.push({id:'r'+Date.now(),productId,name,rating,text,photo:photo||'',video:video||'',approved:false});
    saveDB(db);
    alert('Thank you! Your review is submitted and will appear once approved.');
    location.hash='#/account';
  };
  const reads=[];
  if(photoFile)reads.push(new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(photoFile);}));
  if(videoFile)reads.push(new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(videoFile);}));
  if(!reads.length)return finish('','');
  Promise.all(reads).then(vals=>finish(photoFile?vals[0]:'', photoFile?vals[1]:vals[0]));
}

    <div class="form-field"><label>Title</label><input value="${esc(s.popup.title)}" onchange="updSetting('popup.title',this.value)"></div>

  <div class="admin-card"><strong>Festival Offer</strong>
    <div class="form-field"><label>Enabled</label><select onchange="updSetting('festival.enabled',this.value==='true')"><option value="true" ${s.festival.enabled?'selected':''}>Yes</option><option value="false" ${!s.festival.enabled?'selected':''}>No</option></select></div>
    <div class="form-field"><label>Title</label><input value="${esc(s.festival.title)}" onchange="updSetting('festival.title',this.value)"></div>
    <div class="form-field"><label>Text</label><input value="${esc(s.festival.text)}" onchange="updSetting('festival.text',this.value)"></div></div>
  <div class="admin-card"><strong>Limited-Time Offer</strong>
    <div class="form-field"><label>Enabled</label><select onchange="updSetting('limited.enabled',this.value==='true')"><option value="true" ${s.limited.enabled?'selected':''}>Yes</option><option value="false" ${!s.limited.enabled?'selected':''}>No</option></select></div>
    <div class="form-field"><label>Title</label><input value="${esc(s.limited.title)}" onchange="updSetting('limited.title',this.value)"></div>
    <div class="form-field"><label>Text</label><input value="${esc(s.limited.text)}" onchange="updSetting('limited.text',this.value)"></div></div>
  <div class="admin-card"><strong>Coupons</strong>
    ${s.coupons.map((c,i)=>`<div class="row2" style="margin-bottom:8px"><input value="${esc(c.code)}" onchange="updCoupon(${i},'code',this.value)"><input value="${esc(c.desc)}" onchange="updCoupon(${i},'desc',this.value)"></div>`).join('')}
    <button class="small-btn" onclick="addCoupon()">+ Add Coupon</button></div>`;
}
function updSetting(path,val){
  const parts=path.split('.');let o=db.settings;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=val;saveDB(db);
}
function updCoupon(i,k,v){db.settings.coupons[i][k]=v;saveDB(db);}
function addCoupon(){db.settings.coupons.push({code:'NEWCODE',desc:'Description',active:true});saveDB(db);renderAdminTab();}
function adminSettings(){
  const s=db.settings;
  return `<h2>Settings</h2>
  <div class="admin-card"><strong>Brand</strong>
    <div class="row2"><div class="form-field"><label>Brand Name</label><input value="${esc(s.brand)}" onchange="updSetting('brand',this.value)"></div>
    <div class="form-field"><label>Tagline</label><input value="${esc(s.tagline)}" onchange="updSetting('tagline',this.value)"></div></div>
    <div class="form-field"><label>Logo File Path</label><input value="${esc(s.logoImg)}" onchange="updSetting('logoImg',this.value)"></div>
    <p style="color:var(--muted);font-size:12px">To change the logo, upload a file with this exact name to the <code>assets/images/</code> folder in your GitHub repo — no code edit needed.</p></div>
  <div class="admin-card"><strong>WhatsApp</strong>
    <div class="form-field"><label>WhatsApp Number (with country code, no +)</label><input value="${esc(s.whatsapp)}" onchange="updSetting('whatsapp',this.value)"></div>
    <div class="form-field"><label>Order Message Template</label><textarea style="min-height:120px" onchange="updSetting('waTemplate',this.value)">${esc(s.waTemplate)}</textarea></div></div>
  <div class="admin-card"><strong>Navigation (comma separated)</strong><div class="form-field"><input value="${s.nav.join(',')}" onchange="updSetting('nav',this.value.split(',').map(x=>x.trim()))"></div></div>
  <div class="admin-card"><strong>About Us</strong><div class="form-field"><textarea style="min-height:100px" onchange="updSetting('about',this.value)">${esc(s.about)}</textarea></div></div>
  <div class="admin-card"><strong>Contact</strong>
    <div class="row2"><div class="form-field"><label>Phone</label><input value="${esc(s.contact.phone)}" onchange="updSetting('contact.phone',this.value)"></div>
    <div class="form-field"><label>Email</label><input value="${esc(s.contact.email)}" onchange="updSetting('contact.email',this.value)"></div></div>
    <div class="form-field"><label>Address</label><input value="${esc(s.contact.address)}" onchange="updSetting('contact.address',this.value)"></div></div>
  <div class="admin-card"><strong>Social Links</strong>
    <div class="form-field"><label>Instagram</label><input value="${esc(s.social.instagram)}" onchange="updSetting('social.instagram',this.value)"></div>
    <div class="form-field"><label>Facebook</label><input value="${esc(s.social.facebook)}" onchange="updSetting('social.facebook',this.value)"></div></div>
  <div class="admin-card"><strong>Maintenance Mode</strong>
    <div class="form-field"><label>Status</label><select onchange="updSetting('maintenance',this.value==='true')"><option value="false" ${!s.maintenance?'selected':''}>OFF (site live)</option><option value="true" ${s.maintenance?'selected':''}>ON (show maintenance page)</option></select></div>
    <div class="form-field"><label>Message</label><textarea onchange="updSetting('maintenanceMsg',this.value)">${esc(s.maintenanceMsg)}</textarea></div></div>
  <div class="admin-card"><strong>Admin Password</strong><div class="form-field"><input type="password" placeholder="Set new password" onchange="updSetting('adminPass',this.value)"></div></div>`;
}
</script>
</body>
